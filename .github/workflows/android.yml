# Android shell APK: SDL3 (Java + libSDL3.so) and the C++ runtime, built with the official NDK and Gradle.
# The game code (libmain.so) is built from the player's own default.xbe outside CI and added to this APK by
# tools/android_pack.py -- no game code, data or keys are built or published here.
name: android-shell

on:
  push:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/android.yml' ]
  workflow_dispatch:

permissions:
  contents: write   # the shell APK is also kept on the shell-apk branch (git can fetch it where artifact storage is out of reach)

jobs:
  shell:
    runs-on: ubuntu-latest
    env:
      SDL_TAG: release-3.4.18
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: NDK r27c
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          fi
          echo "NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: SDL3 for Android arm64
        run: |
          git clone --depth 1 -b "$SDL_TAG" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/sdl-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=31 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/sdl-build"
          mkdir -p android/app/libs/arm64-v8a android/app/sdl-java
          cp "$RUNNER_TEMP/sdl-build/libSDL3.so" android/app/libs/arm64-v8a/
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             android/app/libs/arm64-v8a/
          cp -r "$RUNNER_TEMP/SDL/android-project/app/src/main/java/org" android/app/sdl-java/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: APK (debug-signed; tools/android_pack.py signs it again with the game added)
        run: gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: thps2x-android-shell
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Keep the shell APK on the shell-apk branch (one commit, replaced every build)
        run: |
          mkdir "$RUNNER_TEMP/shell" && cd "$RUNNER_TEMP/shell"
          cp "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk" thps2x-android-shell.apk
          printf 'Shell APK of %s (SDL3 %s, no game code). Add libmain.so with tools/android_pack.py.\n' "$GITHUB_SHA" "$SDL_TAG" > README.md
          git init -q -b shell-apk
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "shell APK for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" shell-apk
