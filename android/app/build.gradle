plugins { id 'com.android.application' }

android {
    namespace = "io.github.martin80899.thps2x"
    compileSdk 35
    defaultConfig {
        applicationId "io.github.martin80899.thps2x"
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName "0.1.1-android"
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        jniLibs.srcDirs = ['libs']
        java.srcDirs = ['src/main/java', 'sdl-java']   // sdl-java: SDL3's android-project Java, copied by CI
    }
    packagingOptions { jniLibs { useLegacyPackaging = true } }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError = false }
}
